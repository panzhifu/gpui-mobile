[package]
name = "gpui-mobile-example"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPUI example app for Android and iOS"
publish = false

[lib]
name = "gpui_mobile_example"
crate-type = ["cdylib", "staticlib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "gpui-example"
path = "src/main.rs"

[dependencies]
# Pin the mobile facade support without requiring a published crate.
# gpui-kit 与 gpui-pre 必须一起走：0.3.8 那份 kit 锁死 `gpui-pre =0.3.8`，与根上的
# `=0.3.9` 组不出一个解。这里取 folio 锁里那一份（main 的 f8cf0bd，0.7.3）。
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "f8cf0bd964f9ef2e5b7be79f3a8fc391371feb4a", default-features = false, features = ["component"] }
gpui-mobile = { package = "gpui-pre-mobile", path = "..", version = "0.1.0" }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
log = "0.4"

# 只挂 iOS / Android：OHOS 上没有这条 HTTP 出口，带上它等于把一整个 rustls 栈
# 交叉编译到一个 Tier-3 目标上。
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# 这一格此前是空的，而它并不多余：`example/` 是一个独立 workspace（它有自己的
# `Cargo.lock`），cargo 只认工作区根上的 `[patch]` —— 仓库根那几条对这里**不生效**，
# gpui-mobile 又是以 path 依赖进来的。于是 example 一直在编 crates.io 那份 0.3.9，
# 缺 fork 里的 limits 修复：鸿蒙上 `request_device` 逐条校验失败（`Limit
# 'max_compute_workgroups_per_dimension' value 65535 is better than allowed 0`），
# 日志说的是「没有可用 GPU」，而那其实只是驱动没有 compute。
#
# 两条一起换、同一个 rev：fork 的渲染器用的是 fork 的 `gpui-pre`，分开换就是两棵
# gpui 的 `Window` / `Scene`。
#
# 第三条 `gpui-pre-platform` 才是鸿蒙链得出 cdylib 的那一格：门面按 `target_os` 选
# 平台，鸿蒙报 `target_os = "linux"`，于是桌面 `gpui-pre-linux` 的
# `-lxcb -lxkbcommon -lxkbcommon-x11` 进了链接行，而 OHOS 的 sysroot 里没有这些库。
[patch.crates-io]
gpui-pre = { git = "https://github.com/panzhifu/gpui-folio", rev = "9790a60d619522db8ec904ddfe62931755b7b130" }
gpui-pre-wgpu = { git = "https://github.com/panzhifu/gpui-folio", rev = "9790a60d619522db8ec904ddfe62931755b7b130" }
gpui-pre-platform = { git = "https://github.com/panzhifu/gpui-folio", rev = "9790a60d619522db8ec904ddfe62931755b7b130" }
