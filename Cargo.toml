[package]
name = "gpui-pre-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Balamurali Pandranki <balamurali@live.com>"]
license = "GPL-3.0-or-later OR AGPL-3.0-or-later OR Apache-2.0"
description = "Mobile platform support for GPUI — iOS (wgpu/Metal) and Android (wgpu/Vulkan)"
repository = "https://github.com/longbridge/gpui-mobile"
homepage = "https://github.com/longbridge/gpui-mobile"
keywords = ["gui", "mobile", "ios", "android", "gpui"]
categories = ["gui", "os"]
readme = "README.md"

[features]
default = ["url_launcher", "shared_preferences", "path_provider",
           "package_info", "device_info", "connectivity", "network_info", "vibration",
           "battery", "share", "sensors", "webview", "file_selector", "image_picker", "camera",
           "permission_handler", "notifications", "location", "audio", "video_player",
           "clipboard", "local_auth", "in_app_review", "contacts", "maps_launcher",
           "calendar", "deeplink", "microphone", "maps", "media_session"]
url_launcher = []
shared_preferences = []
path_provider = []
package_info = []
device_info = []
connectivity = []
network_info = []
vibration = []
battery = []
share = []
sensors = []
webview = []
file_selector = []
image_picker = []
camera = []
permission_handler = []
notifications = []
location = []
audio = []
video_player = []
clipboard = []
local_auth = []
in_app_review = []
contacts = []
maps_launcher = []
maps = []
calendar = []
deeplink = []
microphone = []
media_session = []
# Render GPUI windows into images (`gpui_mobile::offscreen`). Needs the patched
# `gpui-pre-wgpu` (see `[patch.crates-io]`), which exposes its headless renderer.
offscreen = ["gpui_wgpu/offscreen", "dep:image"]

[lib]
name = "gpui_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

# ── shared deps (all platforms) ──────────────────────────────────────────────

[dependencies]
anyhow       = "1"
log          = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
parking_lot  = "0.12"
futures      = "0.3"
raw-window-handle = "0.6"
# Same major version as `gpui-pre-wgpu`, whose `RgbaImage` `offscreen` returns.
image        = { version = "0.25", default-features = false, optional = true }

# ── GPUI core crate (provides Platform trait, event types, geometry, etc.) ───
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }

# ── iOS ──────────────────────────────────────────────────────────────────────

[target.'cfg(target_os = "ios")'.dependencies]
# Objective-C runtime
objc2 = "0.6"

# Apple frameworks
core-foundation     = "0.10"
core-foundation-sys = "0.8"
core-graphics       = "0.24"
core-text           = "=21.0.0"
uuid                = { version = "1", features = ["v4", "v5"] }
block2              = "0.6"

# libc 0.2.190 dropped the iOS `_dyld_*` symbol declarations that `backtrace`
# calls in `symbolize/gimli/libs_macos.rs`, which breaks `cargo check` for the
# apple-ios targets (E0425: cannot find `_dyld_image_header` in `libc`). Pin to
# the last good release until a fixed libc (>0.2.190) ships.
libc = "=0.2.189"

# wgpu renderer (Metal backend on iOS/Android)
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9", features = ["font-kit"] }
wgpu = "29.0.4"

# Text / font stack
pathfinder_geometry = "0.5"
smallvec            = { version = "1.6", features = ["union", "const_new"] }

# font-kit (same registry package as gpui-pre-wgpu)
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }

# ── Android ──────────────────────────────────────────────────────────────────

[target.'cfg(target_os = "android")'.dependencies]
# JNI / NDK bindings
jni         = "0.22"
libc        = "0.2"
# Keep `ndk` on the baseline `nativewindow` feature set. Enabling
# `api-level-31` links API 31 symbols directly, so the shared library
# fails to `dlopen` on older Android versions before our own code runs.
ndk         = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys     = "0.6"

# Activity glue layer
android-activity = { version = "0.6", features = ["native-activity"] }

# Logging to logcat
android_logger = "0.15"

# wgpu renderer (Vulkan backend on Android)
# Android uses Cosmic Text and system fonts; font-kit pulls in desktop Fontconfig.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9" }

# TalkBack: exposes GPUI's AccessKit tree (accesskit 0.24, as gpui-pre).
accesskit_android = "0.7.5"

# rustc-hash is required by the PlatformKeyboardMapper trait signature
rustc-hash = "2"
uuid       = { version = "1", features = ["v5"] }

# ── HarmonyOS / OpenHarmony ──────────────────────────────────────────────────
#
# The OHOS triple is `aarch64-unknown-linux-ohos` / `x86_64-unknown-linux-ohos` —
# i.e. `target_os = "linux"` with `target_env = "ohos"`. Rendering goes through
# wgpu's GLES/EGL backend (wgpu-hal has explicit `OhosNdk` support); the Vulkan
# backend has no OHOS surface support. We deliberately do NOT enable gpui_wgpu's
# `font-kit` feature on OHOS — the cosmic-text font database is populated from
# `/system/fonts` at runtime instead.
#
# 渲染器取的是这条线上的 `gpui-pre-wgpu`（根上那条 `[patch.crates-io]` 指向
# `panzhifu/gpui-pre-wgpu`），**不是** zed 上游那份 `gpui_wgpu`：两者挂在不同的
# gpui 上，混进来就是第二棵 `Window` / `Element`。`wgpu` 与 iOS 段同一个版本号，
# 好与 gpui-pre-wgpu 里那份合成一棵。

[target.'cfg(target_env = "ohos")'.dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9" }
wgpu = "29.0.4"

libc       = "0.2"
rustc-hash = "2"
uuid       = { version = "1", features = ["v5"] }

# ── dev ──────────────────────────────────────────────────────────────────────

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }

# ── profiles ─────────────────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 0
debug     = true

# `gpui-pre-wgpu` 0.3.9 with its headless renderer behind an `offscreen` feature
# instead of `test-support` / `bench-support`, a constructor that takes the wgpu
# instance (iOS needs Metal), and methods that release its render target and
# clear its sprite atlas between captures. Applications that enable `offscreen`
# must patch it the same way.
#
# 从前这里是一条 `path = "vendor/gpui-pre-wgpu"`，把整个 crate 抄在本仓库里。那份
# vendor 与 `panzhifu/gpui-pre-wgpu@617a933` 逐文件相同（只差一个 `.gitignore`），
# 而 cargo 的 git 源只读仓库根那份 manifest、指不到别人仓库的子目录 —— 所以那份快照
# 早就抽成了独立仓库。既然它已经在那儿了，就直接指它，不必在树里再养一份副本：
# 副本不会自己更新，而每一次「把 vendor 同步回上游」是一次会漏的手工活。
#
# 现在改指 `panzhifu/gpui-folio`：那条独立仓库停在 617a933，缺了 fork 里
# `wgpu_context.rs` 那一格 limits 修复（`request_device` 直接采用适配器报的那份，
# 而不是 `downlevel_defaults()` 漏下的一整套高值）。鸿蒙模拟器实测两边不是一回事：
# 用 617a933 时 `request_device` 逐条校验失败（`Limit 'max_compute_workgroups_per_dimension'
# value 65535 is better than allowed 0`），一个 adapter 都留不下，日志说的是「没有可用
# GPU」；用 fork 时设备建成、`vsync frame loop started`。同一块驱动，两种死法。
#
# `gpui-pre` 必须跟着一起换：fork 的渲染器用的是 fork 的 `gpui-pre`（页卷曲那套 Mesh
# primitive 与片元里的受光），两棵 gpui 的 `Window` / `Scene` 类型对不上。
#
# 钉 rev 不跟分支：这几条同时换掉桌面的渲染器与那层 platform 门面，飘一个 commit
# 就是换一套像素。
#
# 第三条 `gpui-pre-platform` 是让鸿蒙链得出 cdylib 的那一格：门面按 `target_os` 选
# 平台，而鸿蒙的三元组报 `target_os = "linux"`，于是桌面 `gpui-pre-linux` 的
# `-lxcb -lxkbcommon -lxkbcommon-x11` 进了链接行，OHOS 的 sysroot 里没有这些库 ——
# 编译全过、只有真链才撞，`cargo check` 一路绿灯。判据在那棵树里收紧成
# `all(target_os = "linux", not(target_env = "ohos"))`。
[patch.crates-io]
gpui-pre = { git = "https://github.com/panzhifu/gpui-folio", rev = "9790a60d619522db8ec904ddfe62931755b7b130" }
gpui-pre-wgpu = { git = "https://github.com/panzhifu/gpui-folio", rev = "9790a60d619522db8ec904ddfe62931755b7b130" }
gpui-pre-platform = { git = "https://github.com/panzhifu/gpui-folio", rev = "9790a60d619522db8ec904ddfe62931755b7b130" }
